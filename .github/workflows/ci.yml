name: CI

on:
  # Also on push, so a broken main is found when it breaks rather than at release
  # time. Dispatch-only meant pushing tested nothing, and the release workflow was
  # the first thing to run the suite.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Now that this runs on push, an unbounded hang would burn GitHub's 6h ceiling
    # every time and report as "cancelled" rather than as a failure.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Test
        run: go test ./... -count=1

      - name: Build
        run: go build -o htmlclay${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/htmlclay
        env:
          CGO_ENABLED: ${{ runner.os == 'macOS' && '1' || '0' }}

  # The conformance gate drives the Malleable HTML File host-test page against a real
  # listener, in a browser, from the host's own origin. That origin is the point: the
  # spec requires exact origin validation on every save, so a save can only be proven
  # from the origin that will be allowed to make it, and the cross-origin refusal needs
  # a real sandboxed iframe. `go test ./...` skips this unless HTMLCLAY_HOST_GATE=1,
  # because it wants node, playwright and a downloaded browser.
  #
  # Linux only. The gate tests the protocol this host speaks, which is the same on every
  # platform, and the matrix above already proves the suite builds and runs everywhere.
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # --no-save on purpose: this package.json belongs to the website's wrangler
      # deploy, and the browser driver is wanted by one test job, not by the package.
      - name: Install the browser driver
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Conformance gate
        run: go test ./internal/server -run TestMalleableHTMLFileHostGate -count=1 -v
        env:
          HTMLCLAY_HOST_GATE: "1"
          HTMLCLAY_HOST_GATE_RUNNER: ${{ github.workspace }}/testdata/conformance/host-test.mjs
          HTMLCLAY_HOST_GATE_CWD: ${{ github.workspace }}

  # The shipped Linux tarball, used the way a Linux user uses it: install.sh into a
  # fresh HOME, the desktop must know the file type, a file must serve and save from
  # a real browser, tray mode must survive a machine with no session bus, the
  # permission prompt must appear and fail closed without a dialog tool, and
  # uninstall.sh must leave nothing behind. `go test` proves the code; this proves
  # the download. Both shipped arches, on the runners that build them.
  linux-desktop:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build the Linux binary the tarball ships
        run: bash packaging/linux/build.sh

      # What a stock Ubuntu desktop has and a bare runner does not: the MIME and
      # desktop-entry tooling install.sh talks to, zenity for the prompt, and a
      # virtual display to show it on.
      - name: Install desktop tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb zenity xdotool dbus-x11 shared-mime-info desktop-file-utils xdg-utils libglib2.0-bin imagemagick jq

      - name: Install the browser driver
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Linux checks
        run: bash scripts/linux-checks/run-all.sh

      - name: Upload check artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-checks-${{ matrix.runner }}
          path: linux-check-artifacts/
